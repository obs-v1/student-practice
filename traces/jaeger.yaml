# Jaeger — the trace store + UI. All-in-one (collector + query + UI + in-memory storage
# fused into one pod), lab sizing. Traces are kept in memory and lost on restart; fine
# for a lab.
#
# The crucial flag is COLLECTOR_OTLP_ENABLED=true: it turns on Jaeger's OWN native OTLP
# receiver on :4317/:4318. That means the app can send traces straight to Jaeger — there
# is NO OpenTelemetry Collector in between. (Read docs/04 for the honest catch: the app
# can only speak OTLP because it is instrumented with the OTel SDK. Metrics and logs
# needed no such thing — traces do. That asymmetry is the whole lesson.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels: { app: jaeger }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }   # native OTLP in on 4317/4318
          ports:
            - { name: ui,        containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 700Mi }
---
# Two services, on purpose, so the two roles are visible:
#  - jaeger-collector : where traces are INGESTED (the app's OTLP target)
#  - jaeger           : the query UI you open in a browser
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: monitoring
  labels: { app: jaeger }
spec:
  selector: { app: jaeger }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  labels: { app: jaeger }
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: 16686, nodePort: 30686 }
