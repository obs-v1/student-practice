# Helm values for grafana/loki 3.x in SingleBinary mode — the OTEL module's Loki.
#
# WHY A SEPARATE FILE (not ../logs/values.yaml):
#   The by-hand lab installs the old grafana/loki-stack chart (Loki 2.9.8 + Promtail), which has
#   NO OTLP ingest. The OTEL module ships logs through the Collector as native OTLP
#   (otlphttp → /otlp), and that endpoint only exists in Loki 3.x. So the OTEL `backends` step
#   installs THIS chart (grafana/loki, deploymentMode: SingleBinary) instead.
#
# KEEP THE SERVICE NAMED `loki` ON :3100 so nothing else has to change — the Collector sends to
#   http://loki.monitoring.svc:3100/otlp, the Makefile port-forwards svc/loki, and Grafana's Loki
#   datasource points at http://loki:3100. fullnameOverride + gateway.enabled=false give us a
#   single `loki` Service on 3100 (no nginx gateway in front).

fullnameOverride: loki
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  # One replica, one of everything — a teaching cluster, not production.
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  # Loki 3.x REQUIRES an explicit schema; tsdb + v13 is what enables OTLP structured metadata.
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    # OTLP → labels mapping. By default Loki promotes a curated set of resource attributes to
    # index labels and drops the rest to structured metadata. We make sure the three the lab
    # selects on stay INDEX LABELS (k8s_namespace_name / k8s_container_name / k8s_pod_name) so
    # {k8s_container_name="account-service"} and the trace→logs drill keep working; the app's own
    # JSON fields (trace_id, level, …) live in the log line body, parsed by Grafana at query time.
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes:
              - k8s.namespace.name
              - k8s.container.name
              - k8s.pod.name
  # Single-binary has no ruler target here; silence its storage warning.
  rulerConfig:
    storage:
      type: local

# One pod. Ephemeral storage is fine — logs don't need to survive a teardown in the lab.
singleBinary:
  replicas: 1
  persistence:
    enabled: false

# Turn OFF the scalable-mode components (we are SingleBinary) and the extras the chart adds by
# default (nginx gateway, canary, test, bundled MinIO, caches) — none are needed for the lab.
read:    { replicas: 0 }
write:   { replicas: 0 }
backend: { replicas: 0 }
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
