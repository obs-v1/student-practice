# rate-limiter — bankobs service (part of the "core-banking" domain).
#
# Deployed WITHOUT a prometheus.io/scrape annotation on purpose. Nothing scrapes this
# service until YOU opt it in. To bring it under monitoring, uncomment the annotations
# block below (Prometheus's scrape config keeps only pods with prometheus.io/scrape=true).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limiter
  labels:
    app: rate-limiter
    domain: core-banking
    log_format: json
spec:
  replicas: 1
  selector: { matchLabels: { app: rate-limiter } }
  template:
    metadata:
      labels:
        app: rate-limiter
        domain: core-banking
        log_format: json
      # ─── opt this service INTO monitoring: uncomment these three lines ───
      # annotations:
      #   prometheus.io/scrape: "true"
      #   prometheus.io/path:   "/metrics"
      #   prometheus.io/port:   "8082"
    spec:
      containers:
        - name: rate-limiter
          image: "{{ .Values.global.registry }}/rate-limiter:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8082
          env:
            - name: SERVICE_NAME
              value: rate-limiter
            - name: SERVICE_PORT
              value: "8082"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OBSERVABILITY_MODE
              value: full
          livenessProbe:
            httpGet: { path: /health/live, port: 8082 }
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 8082 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
