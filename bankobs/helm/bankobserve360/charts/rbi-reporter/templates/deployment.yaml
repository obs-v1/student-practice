# rbi-reporter — bankobs service (part of the "audit-compliance" domain).
#
# Deployed WITHOUT a prometheus.io/scrape annotation on purpose. Nothing scrapes this
# service until YOU opt it in. To bring it under monitoring, uncomment the annotations
# block below (Prometheus's scrape config keeps only pods with prometheus.io/scrape=true).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbi-reporter
  labels:
    app: rbi-reporter
    domain: audit-compliance
    log_format: json
spec:
  replicas: 1
  selector: { matchLabels: { app: rbi-reporter } }
  template:
    metadata:
      labels:
        app: rbi-reporter
        domain: audit-compliance
        log_format: json
      # ─── opt this service INTO monitoring: uncomment these three lines ───
      # annotations:
      #   prometheus.io/scrape: "true"
      #   prometheus.io/path:   "/metrics"
      #   prometheus.io/port:   "8061"
    spec:
      containers:
        - name: rbi-reporter
          image: "{{ .Values.global.registry }}/rbi-reporter:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8061
          env:
            - name: SERVICE_NAME
              value: rbi-reporter
            - name: SERVICE_PORT
              value: "8061"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OBSERVABILITY_MODE
              value: full
          livenessProbe:
            httpGet: { path: /health/live, port: 8061 }
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 8061 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
