# payment-gateway — bankobs service (part of the "payments" domain).
#
# Deployed WITHOUT a prometheus.io/scrape annotation on purpose. Nothing scrapes this
# service until YOU opt it in. To bring it under monitoring, uncomment the annotations
# block below (Prometheus's scrape config keeps only pods with prometheus.io/scrape=true).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  labels:
    app: payment-gateway
    domain: payments
    log_format: json
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-gateway } }
  template:
    metadata:
      labels:
        app: payment-gateway
        domain: payments
        log_format: json
      # ─── opt this service INTO monitoring: uncomment these three lines ───
      # annotations:
      #   prometheus.io/scrape: "true"
      #   prometheus.io/path:   "/metrics"
      #   prometheus.io/port:   "8010"
    spec:
      containers:
        - name: payment-gateway
          image: "{{ .Values.global.registry }}/payment-gateway:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8010
          env:
            - name: SERVICE_NAME
              value: payment-gateway
            - name: SERVICE_PORT
              value: "8010"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OBSERVABILITY_MODE
              value: full
          livenessProbe:
            httpGet: { path: /health/live, port: 8010 }
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 8010 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
