# pci-logger — bankobs service (part of the "audit-compliance" domain).
#
# Deployed WITHOUT a prometheus.io/scrape annotation on purpose. Nothing scrapes this
# service until YOU opt it in. To bring it under monitoring, uncomment the annotations
# block below (Prometheus's scrape config keeps only pods with prometheus.io/scrape=true).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pci-logger
  labels:
    app: pci-logger
    domain: audit-compliance
    log_format: raw
spec:
  replicas: 1
  selector: { matchLabels: { app: pci-logger } }
  template:
    metadata:
      labels:
        app: pci-logger
        domain: audit-compliance
        log_format: raw
      # ─── opt this service INTO monitoring: uncomment these three lines ───
      # annotations:
      #   prometheus.io/scrape: "true"
      #   prometheus.io/path:   "/metrics"
      #   prometheus.io/port:   "8062"
    spec:
      containers:
        - name: pci-logger
          image: "{{ .Values.global.registry }}/pci-logger:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8062
          env:
            - name: SERVICE_NAME
              value: pci-logger
            - name: SERVICE_PORT
              value: "8062"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OBSERVABILITY_MODE
              value: full
          livenessProbe:
            httpGet: { path: /health/live, port: 8062 }
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 8062 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
