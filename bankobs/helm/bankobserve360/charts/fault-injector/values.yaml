# Hand-maintained (NOT generated by scripts/gen-helm.py): the fault-injector
# needs RBAC and ships scaled to zero, neither of which the generic template
# covers.
# `global` values are supplied by the umbrella chart; these defaults only
# matter when this sub-chart is installed or linted on its own.
global:
  registry: ghcr.io/bankobserve360
  imageTag: "1.0.0"
  pullPolicy: IfNotPresent
  observability:
    mode: full
  otel:
    endpoint: http://otel-collector.monitoring.svc.cluster.local:4317

faultInjector:
  # Shipped dormant. The chart installs the Deployment, Service, RBAC and
  # config so everything is in place; scale it up only when you want to break
  # something:
  #   kubectl -n bankobs scale deploy/fault-injector --replicas=1
  #   make eks-fault-up
  replicas: 0

  port: 8091
  metricsPort: 9091

  # It logs JSON through the shared Go svc.Logger, so Loki can parse it as JSON.
  logFormat: json

  image:
    repository: ""        # defaults to {{ global.registry }}/fault-injector
    tag: ""               # defaults to global.imageTag

  rbac:
    # The injector scales workloads, deletes pods, patches resource limits and
    # applies NetworkPolicies. Namespace-scoped: it cannot touch anything
    # outside its own release namespace.
    create: true

  serviceAccount:
    create: true
    name: fault-injector

  # Keep the observability stack off-limits — breaking Grafana or the
  # collector destroys the evidence students are meant to read.
  allowObservability: false

  # Force the enforcement plane. Empty = auto-detect (in-cluster ⇒ kubernetes).
  platform: ""

  resources:
    requests: { cpu: "50m",  memory: "64Mi" }
    limits:   { cpu: "500m", memory: "256Mi" }

  nodeSelector: {}
  tolerations: []
  affinity: {}
