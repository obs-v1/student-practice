# sms-gateway — bankobs service (part of the "notifications" domain).
#
# Deployed WITHOUT a prometheus.io/scrape annotation on purpose. Nothing scrapes this
# service until YOU opt it in. To bring it under monitoring, uncomment the annotations
# block below (Prometheus's scrape config keeps only pods with prometheus.io/scrape=true).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-gateway
  labels:
    app: sms-gateway
    domain: notifications
    log_format: raw
spec:
  replicas: 1
  selector: { matchLabels: { app: sms-gateway } }
  template:
    metadata:
      labels:
        app: sms-gateway
        domain: notifications
        log_format: raw
      # ─── opt this service INTO monitoring: uncomment these three lines ───
      # annotations:
      #   prometheus.io/scrape: "true"
      #   prometheus.io/path:   "/metrics"
      #   prometheus.io/port:   "8051"
    spec:
      containers:
        - name: sms-gateway
          image: "{{ .Values.global.registry }}/sms-gateway:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8051
          env:
            - name: SERVICE_NAME
              value: sms-gateway
            - name: SERVICE_PORT
              value: "8051"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OBSERVABILITY_MODE
              value: full
          livenessProbe:
            httpGet: { path: /health/live, port: 8051 }
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 8051 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
