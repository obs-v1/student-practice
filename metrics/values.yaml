# Helm values for the Prometheus server (chart: prometheus-community/prometheus).
# Replaces the hand-written namespace/RBAC/config/Deployment manifests — the chart brings its
# own ServiceAccount + RBAC (for pod discovery) and the server. We keep it lean (server only)
# and still teach the pull model: the scrape config below is the same annotation-based
# discovery, reaching into each bankobs pod's /metrics. Installed with one `helm upgrade -i`.

# Lean install — just the server. No Alertmanager/pushgateway/exporters for this lab.
alertmanager:            { enabled: false }
prometheus-pushgateway:  { enabled: false }
kube-state-metrics:      { enabled: false }
prometheus-node-exporter:{ enabled: false }

server:
  retention: 6h
  # Scrape every 15s (the chart default is 60s). This matters for the dashboards: Grafana's
  # $__rate_interval assumes a 15s scrape, so with a 60s scrape every rate()/histogram_quantile
  # panel resolves to a ~60s window that holds only ONE sample and renders "No data" — while
  # instant gauges (e.g. resident memory) still work. 15s gives rate() ~4 samples per minute.
  global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s
  service:
    type: NodePort
    nodePort: 30909        # kind maps host :9090 -> this nodePort
  # keep it small on the single node
  resources:
    requests: { cpu: 100m, memory: 300Mi }
    limits:   { memory: 800Mi }

# THE pull model, as Helm values instead of a separate ConfigMap. Prometheus discovers pods
# and scrapes only those in the bankobs namespace that carry prometheus.io/scrape=true, using
# their prometheus.io/path + prometheus.io/port. The relabels also set app/namespace/pod so the
# dashboard can group by service.
#
# NOTE on where this goes. Chart 29.x keeps its own default jobs in `scrapeConfigs` — a MAP
# keyed by job name — and the server ConfigMap template APPENDS
# serverFiles."prometheus.yml".scrape_configs to them (templates/cm.yaml). A list there does
# not replace the defaults, so a self-scrape job called `prometheus` collides with the chart's
# own and Prometheus refuses to start:
#     found multiple scrape configs with job name "prometheus"
# Declaring jobs in the map avoids that by construction: the key IS the job name, so a
# collision overrides instead of duplicating.
scrapeConfigs:
  # The chart's own self-scrape. Kept — this is the one that used to be declared twice.
  prometheus:
    enabled: true

  # This lab's pull model: annotation-based discovery, scoped to the bankobs namespace.
  bankobs-pods:
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: bankobs
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_label_domain]
        target_label: domain
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # Off for this lab. kubernetes-pods does the same annotation discovery cluster-wide, so
  # leaving it on scrapes every bankobs pod a SECOND time under a different job name —
  # duplicate series for the same target. The rest are cluster-infra jobs this lab does not
  # use, and prometheus-pushgateway has no backend since the subchart is disabled above.
  kubernetes-api-servers:            { enabled: false }
  kubernetes-nodes:                  { enabled: false }
  kubernetes-nodes-cadvisor:         { enabled: false }
  kubernetes-pods:                   { enabled: false }
  kubernetes-pods-slow:              { enabled: false }
  kubernetes-service-endpoints:      { enabled: false }
  kubernetes-service-endpoints-slow: { enabled: false }
  kubernetes-services:               { enabled: false }
  prometheus-pushgateway:            { enabled: false }
