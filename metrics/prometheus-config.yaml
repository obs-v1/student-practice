# THE heart of metrics-the-core-way: a scrape config. Prometheus PULLS metrics — it
# reaches out to each app pod's /metrics endpoint on a timer. Nothing is pushed, and no
# OpenTelemetry Collector sits in the middle. The app just has to expose /metrics (the
# bankobs services already do; the `make metrics` step turns the annotation back on).
#
# How a pod opts in: the three `prometheus.io/*` pod annotations below. This is a
# 15-year-old convention, not a Kubernetes feature — Prometheus reads the annotations
# during service discovery and decides what to scrape. Read the relabel_configs as the
# rules that turn "every pod in the cluster" into "the handful that asked to be scraped."
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # ── Prometheus scraping itself (sanity target) ───────────────────────────
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # ── The bankobs application pods ─────────────────────────────────────────
      # Discover every pod, then keep only those in the `bankobs` namespace that
      # carry prometheus.io/scrape=true. Their /metrics endpoint is scraped directly.
      - job_name: bankobs-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # 1. only the application namespace
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: bankobs
          # 2. only pods that opted in with prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # 3. use the path from prometheus.io/path (defaults to /metrics)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # 4. use the port from prometheus.io/port: combine pod IP + that port
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          # 5. friendly labels so the metrics are explorable
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_domain]
            target_label: domain
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
