# A plain single-node kind cluster on one EC2 host — Kubernetes only, no application.
#
# extraPortMappings publish a handful of NodePorts on the EC2 host so lab UIs are
# reachable from a browser without a port-forward. The ports below match the
# student-practice lab (Prometheus 30909, Jaeger 30686) plus the usual spares; add
# your own mapping here if a lab uses a different NodePort.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  - role: control-plane
    # Kubernetes version pinned so it doesn't drift with the kind binary.
    # Needs kind >= v0.32.0 (see scripts/install-tools.sh).
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    extraPortMappings:
      - { containerPort: 30080, hostPort: 80,    protocol: TCP }   # generic web / portal
      - { containerPort: 30443, hostPort: 443,   protocol: TCP }   # generic TLS
      - { containerPort: 30300, hostPort: 3000,  protocol: TCP }   # grafana (if you add one)
      - { containerPort: 30909, hostPort: 9090,  protocol: TCP }   # prometheus (student-practice)
      - { containerPort: 30686, hostPort: 16686, protocol: TCP }   # jaeger     (student-practice)
      - { containerPort: 30310, hostPort: 3100,  protocol: TCP }   # loki       (optional)
