# A plain single-node kind cluster on one EC2 host — Kubernetes only, no application.
#
# extraPortMappings publish the lab's NodePorts on the EC2 host so the UIs are reachable
# in a browser without a port-forward. Only the ports this lab actually serves are mapped —
# if you add a backend on a new NodePort, add its mapping here too.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  - role: control-plane
    # Kubernetes version pinned so it doesn't drift with the kind binary.
    # Needs kind >= v0.32.0 (see scripts/install-tools.sh).
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    extraPortMappings:
      - { containerPort: 30080, hostPort: 80,    protocol: TCP }   # bankobs web portal (make traffic)
      - { containerPort: 30909, hostPort: 9090,  protocol: TCP }   # Prometheus UI
      - { containerPort: 30686, hostPort: 16686, protocol: TCP }   # Jaeger UI
