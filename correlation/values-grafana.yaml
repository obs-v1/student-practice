# Helm values for Grafana (chart: grafana/grafana) — the correlation pane over the three
# backends. Replaces the hand-written Deployment/ConfigMaps; datasources, correlation wiring
# and the overview dashboard all ride in here, installed with one `helm upgrade -i`.
#
# The correlation is the point:
#   - Jaeger "tracesToLogsV2": from a span, the "Related logs" button opens Loki at the span's
#     time window (trace->logs BY TIME WINDOW; you narrow to the service by hand).
#
# Why time-window and not an automatic by-service/by-trace-id jump — this is the by-hand lesson:
#   - NOT by trace id: bankobs logs do not carry Jaeger's trace id (the Go/journey tier logs an app
#     trace_id that does not match Beyla's span ids; the Java core-banking tier logs only a
#     correlation_id), so a trace-id log search returns nothing.
#   - NOT automatically by service either: the classic Jaeger data source stores a span's service in
#     `process.serviceName`, NOT as a span tag, and Grafana's trace->logs cannot read it (the custom
#     query exposes ${__span.spanId|name|tags...} but no serviceName, and `service.name` is not in
#     ${__span.tags}). So the button can only hand Loki a *time window*; you finish the hop yourself by
#     typing the service, e.g. {app="account-service"}. (The OTEL module's collector makes this one
#     click — that contrast is the point of doing it by hand here.)

# Pin Grafana to the latest 13.x (chart appVersion still tracks 12.x, so override the image tag).
image:
  tag: "13.2.4"

# Log in with admin / admin.
adminUser: admin
adminPassword: admin

service:
  type: NodePort
  nodePort: 30300            # kind maps host :3000 -> this nodePort

# Sign in as admin / admin.
grafana.ini:
  auth:
    disable_login_form: false   # show the login page
  "auth.anonymous":
    enabled: false              # require sign-in

persistence:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server     # the prometheus Helm chart's server service (port 80)
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          maxLines: 2000
      - name: Jaeger
        type: jaeger
        uid: jaeger
        access: proxy
        url: http://jaeger:16686
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            filterByTraceID: false        # logs do not carry Jaeger's trace id
            filterBySpanID: false
            customQuery: true             # a tag map on service.name can't resolve (see header) — so
            query: '{namespace="bankobs"}'  # open Loki at the span's window; narrow to {app="<svc>"} by hand

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    bankobs-overview:
      json: |
        {
          "uid": "bankobs-overview",
          "title": "bankobs — services overview",
          "schemaVersion": 39,
          "editable": true,
          "time": { "from": "now-15m", "to": "now" },
          "refresh": "10s",
          "panels": [
            {
              "id": 1, "type": "timeseries",
              "title": "p95 request latency by service (seconds)",
              "gridPos": { "h": 10, "w": 24, "x": 0, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
              "targets": [ { "refId": "A", "expr": "histogram_quantile(0.95, sum by (app, le) (rate(http_request_duration_seconds_bucket{namespace=\"bankobs\"}[1m])))", "legendFormat": "{{app}}" } ]
            },
            {
              "id": 2, "type": "timeseries",
              "title": "request rate by service (req/s)",
              "gridPos": { "h": 9, "w": 16, "x": 0, "y": 10 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "targets": [ { "refId": "A", "expr": "sum by (app) (rate(http_request_duration_seconds_count{namespace=\"bankobs\"}[1m]))", "legendFormat": "{{app}}" } ]
            },
            {
              "id": 3, "type": "stat",
              "title": "services reporting metrics",
              "gridPos": { "h": 9, "w": 8, "x": 16, "y": 10 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "targets": [ { "refId": "A", "expr": "count(count by (app) (up{namespace=\"bankobs\"} == 1))" } ]
            }
          ]
        }
