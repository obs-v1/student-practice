# Correlation module — Grafana over the three hand-built backends, with trace<->logs wired.
#
# This is the PAYOFF after the by-hand lab: put one pane over Prometheus + Loki + Jaeger and
# the signals start linking. The key config is in the Loki and Jaeger datasources below:
#   - Loki  "derivedFields": pull trace_id out of each JSON log line  -> link to Jaeger  (logs->trace)
#   - Jaeger "tracesToLogsV2": from a span, query Loki for that trace id                 (trace->logs)
# Both work because bankobs logs are JSON containing "trace_id":"...".
#
# Anonymous admin is on so the UI opens straight into Explore/dashboards with no login.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: 15s

      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          maxLines: 2000
          # logs -> trace: extract the trace id from the JSON log line, link to Jaeger.
          derivedFields:
            - name: TraceID
              matcherType: regex
              matcherRegex: '"trace_id":"(\w+)"'
              url: '$${__value.raw}'
              datasourceUid: jaeger

      - name: Jaeger
        type: jaeger
        uid: jaeger
        access: proxy
        url: http://jaeger:16686
        jsonData:
          # trace -> logs: from a span, open Loki filtered to that same trace id.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            filterByTraceID: false
            customQuery: true
            query: '{namespace="bankobs"} |= "$${__trace.traceId}"'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        type: file
        folder: ''
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels: { app: grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.4
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED,   value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE,  value: "Admin" }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM,  value: "true" }
            - { name: GF_AUTH_BASIC_ENABLED,       value: "false" }
            - { name: GF_SECURITY_ALLOW_EMBEDDING, value: "true" }
          ports:
            - { name: http, containerPort: 3000 }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashprovider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards,  mountPath: /var/lib/grafana/dashboards }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 512Mi }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashprovider
          configMap: { name: grafana-dashboards-provider }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels: { app: grafana }
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: 30300 }
