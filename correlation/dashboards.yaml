# The "all services" overview dashboard (story step 1). p95 latency per service makes the
# fault-injector's CPU-throttle spike obvious; request-rate and services-up give the at-a-glance
# health. Metrics come straight from Prometheus scraping each pod's /metrics (no OTel).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  overview.json: |
    {
      "uid": "bankobs-overview",
      "title": "bankobs — services overview",
      "schemaVersion": 39,
      "editable": true,
      "time": { "from": "now-15m", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "p95 request latency by service (seconds)",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (app, le) (rate(http_request_duration_seconds_bucket{namespace=\"bankobs\"}[1m])))",
              "legendFormat": "{{app}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "request rate by service (req/s)",
          "gridPos": { "h": 9, "w": 16, "x": 0, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (app) (rate(http_request_duration_seconds_count{namespace=\"bankobs\"}[1m]))",
              "legendFormat": "{{app}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "services reporting metrics",
          "gridPos": { "h": 9, "w": 8, "x": 16, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "count(count by (app) (up{namespace=\"bankobs\"} == 1))" }
          ]
        }
      ]
    }
