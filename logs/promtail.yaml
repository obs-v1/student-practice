# Promtail as a DaemonSet — one pod per node, because log files live on the node's disk.
# It mounts the node's /var/log (read-only) to reach the container logs. Lab sizing: one
# node means one Promtail pod.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels: { app: promtail }
spec:
  selector: { matchLabels: { app: promtail } }
  template:
    metadata:
      labels: { app: promtail }
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.1.1
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          ports:
            - { name: http, containerPort: 9080 }
          volumeMounts:
            - { name: config,    mountPath: /etc/promtail }
            - { name: run,       mountPath: /run/promtail }
            - { name: pods,      mountPath: /var/log/pods,       readOnly: true }
            - { name: containers, mountPath: /var/log/containers, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: promtail-config }
        - name: run
          hostPath: { path: /run/promtail }
        - name: pods
          hostPath: { path: /var/log/pods }
        - name: containers
          hostPath: { path: /var/log/containers }
      tolerations:
        - effect: NoSchedule
          operator: Exists
